[package]
name = "abes_nice_things"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/Course-Brains/abes_nice_things"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "run"
path = "src/bin/run/main.rs"

[[bin]]
name = "encrypt"
path = "src/encrypt.rs"

[[bin]]
name = "decrypt"
path = "src/decrypt.rs"

[dependencies]
anyhow = { version = "1.0", optional = true }

[features]
default = []
dyn_binary = []
anyhow = ["dep:anyhow"]
